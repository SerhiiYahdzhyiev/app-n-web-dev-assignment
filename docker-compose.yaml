version: '3.8'

volumes:
  db-data:
    driver: local
  qdrant_storage:
    driver: local

networks:
  ecom_net:

services:
  webserver:
    build: ./webserver
    container_name: ecom-webserver
    volumes:
      - ./webserver/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - ecom_net
    ports:
      - 127.0.0.1:8080:80

  embed:
    build: ./embed
    container_name: ecom-embeddings
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - ecom_net

  recommend:
    build: ./recommend
    container_name: ecom-recommend
    depends_on:
      cache:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REC_COUNT=${REC_COUNT}
    networks:
      - ecom_net

  frontend:
    build: ./frontend
    container_name: ecom-frontend
    networks:
      - ecom_net

  backend:
    build:
      context: ./backend
      target: dev
    container_name: ecom-backend
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      DB_PORT: 27017
      DB_NAME: ecom
      DB_USER: ecom
      DB_PASSWORD: ecomsecret
      PSWD_HASH_SALT: 42
      SECRET: ecomsecret
      TOKEN_EXPIRES: 1d
      LOGS_PATH: /tmp/ecom-logs
    networks:
      - ecom_net
    volumes:
      - ./backend/:/home/node/app:ro
    ports:
      - 127.0.0.1:5000:5000
    healthcheck:
      test: ["CMD", "curl", "http://localhost:5000/health",]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  database:
    build: ./database
    container_name: ecom-database
    environment:
      MONGO_INITDB_ROOT_USERNAME: ecom
      MONGO_INITDB_ROOT_PASSWORD: ecomsecret
      DB_NAME: ecom
    volumes:
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/01-seed.js:ro
      - db-data:/data/db
    networks:
      - ecom_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cache:
    build: ./cache
    container_name: ecom-cache
    restart: always
    networks:
      - ecom_net
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6378", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
