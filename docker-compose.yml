volumes:
  db-data:
    driver: local
  qdrant_storage:
    driver: local

networks:
  ecom_net:

services:
  embed:
    build: ./embed
    container_name: ecom-embeddings
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_NAME: ecom
      DB_USER: ecom
      DB_PASSWORD: ecomsecret
    networks:
      - ecom_net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3096/health', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 300s

  recommend:
    build:
      context: ./recommend
      target: dev
    container_name: ecom-recommend
    depends_on:
      cache:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      DB_NAME: ecom
      DB_USER: ecom
      DB_PASSWORD: ecomsecret
      REC_COUNT: 3
      CACHE_EXP: 600
      LOGS_PATH: /tmp/ecom-logs
    networks:
      - ecom_net
    volumes:
      - ./recommend/:/home/node/app:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: ecom-frontend
    networks:
      - ecom_net
    volumes:
      - ./frontend/:/home/node/app:ro
    ports:
      - 127.0.0.1:8080:4200

  backend:
    build:
      context: ./backend
      target: dev
    container_name: ecom-backend
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      DB_PORT: 27017
      DB_NAME: ecom
      DB_USER: ecom
      DB_PASSWORD: ecomsecret
      PSWD_HASH_SALT: 42
      SECRET: ecomsecret
      TOKEN_EXPIRES: 1d
      LOGS_PATH: /tmp/ecom-logs
    networks:
      - ecom_net
    volumes:
      - ./backend/:/home/node/app:ro
    ports:
      - 127.0.0.1:5000:5000
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  database:
    build: ./database
    container_name: ecom-database
    environment:
      MONGO_INITDB_ROOT_USERNAME: ecom
      MONGO_INITDB_ROOT_PASSWORD: ecomsecret
      DB_NAME: ecom
    volumes:
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/01-seed.js:ro
      - db-data:/data/db
    networks:
      - ecom_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cache:
    build: ./cache
    container_name: ecom-cache
    restart: always
    networks:
      - ecom_net
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6378", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
